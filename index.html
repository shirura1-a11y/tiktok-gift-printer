<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Atelier — 縦型ギフトプリンター</title><script>document.documentElement.classList.toggle('obs-mode',new URLSearchParams(window.location.search).get('obs')==='1');</script><link rel="stylesheet" href="style.css"></head><body>
<main class="workspace">
<section class="broadcast" aria-label="配信画面：1080×1920、縦型9対16"><canvas id="scene" width="1080" height="1920" aria-label="上25パーセントに黄金額縁5枚、中央30パーセントにプリンター、下45パーセントに印刷写真を展示"></canvas></section>
<aside class="panel" aria-label="配信画面外の操作パネル"><header><span class="eyebrow">GIFT ATELIER / LOCAL STUDIO</span><h1>ギフトプリンター</h1><p>1080 × 1920 · 9:16<br>左の縦型画面だけが配信エリアです。</p></header>
<div class="live-status"><i id="status-dot"></i><span id="status" role="status" aria-live="polite">プリンター待機中</span><span class="queue">待機 <b id="queue">0</b></span></div>
<section class="live-panel" aria-label="LIVE自動印刷の状態"><h2 id="live-status" role="status" aria-live="polite">LIVE連携準備中</h2><p id="live-detail"></p><p id="live-error" role="alert"></p><div id="demo-receiver" hidden><span>サーバー経由の受信テスト</span><div class="demo-buttons"><button type="button" data-receive-gift="rose">🌹</button><button type="button" data-receive-gift="roza">✨</button><button type="button" data-receive-gift="eternal">👑</button></div></div></section><section class="user-picker"><h2>サンプルユーザー</h2><div id="samples" class="samples" role="group" aria-label="印刷するユーザー"></div></section>
<section class="gift-tests"><h2>ギフト別テスト</h2><button id="test-rose" class="gift rose" type="button"><span class="gift-icon">🌹</span><span><strong>バラ</strong><small>通常写真を印刷</small></span><span>↗</span></button><button id="test-roza" class="gift roza" type="button"><span class="gift-icon">✨</span><span><strong>ローザ</strong><small>金糸の刺繍模様 × 豪華な金縁</small></span><span>↗</span></button><button id="test-eternal" class="gift eternal" type="button"><span class="gift-icon">👑</span><span><strong>永遠のローザ</strong><small>金糸入り写真 ＋ 黄金額縁に展示</small></span><span>↗</span></button><p class="hint">連続クリックも受付順に印刷。上部展示は最新5枚を自動保存します。</p></section>
<div class="utility"><button id="print" type="button">通常テスト印刷</button><button id="sound" type="button" aria-pressed="true">♪ 音声 ON</button><button id="clear" type="button">用紙を片づける</button></div><p id="gallery-note" class="storage-note" role="status">展示履歴はこのブラウザに自動保存されます</p><footer>9:16 CANVAS · ローカルギフトプリンター<br>操作パネルは配信エリアに含まれません。</footer></aside>
</main><script src="script.js"></script><script src="bridge.js"></script></body></html>
